<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ichon Coastal Corridor</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; background: #f5f5f5; }

        /* Sidebar Styling */
        #sidebar { width: 350px; display: flex; flex-direction: column; background: white; border-right: 1px solid #ccc; z-index: 1001; transition: transform 0.3s ease; }
        .sidebar-hidden { display: none !important; }
        .sidebar-content { flex-grow: 1; padding: 20px; overflow-y: auto; position: relative; }
        
        #sidebar-image-container { width: 100%; height: 200px; background: #eee; border-radius: 8px; margin-bottom: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #sidebar-image-container img { width: 100%; height: 100%; object-fit: cover; }
        
        #poi-title { font-size: 1.5rem; margin-bottom: 8px; }
        #poi-meta { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 12px; }
        #poi-description { font-size: 1rem; line-height: 1.5; color: #333; }
        
        .close-btn { position: absolute; top: 10px; right: 10px; background: #eee; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }

        #map-container { flex-grow: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        #status-bar { position: absolute; bottom: 0; width: 100%; background: rgba(255,255,255,0.9); padding: 10px; z-index: 1000; font-size: 0.8rem; border-top: 1px solid #ccc; }
        .btn-fullscreen { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-content">
            <button class="close-btn" onclick="closeSidebar()">X</button>
            <div id="sidebar-image-container"></div>
            <h2 id="poi-title">Select a Marker</h2>
            <div id="poi-meta">Category: N/A</div>
            <p id="poi-description">Click on a map marker to view details about the location.</p>
        </div>
        <button class="btn-fullscreen" onclick="toggleFullscreen()">Toggle Fullscreen</button>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <div id="status-bar">Lat: 0, Lng: 0</div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="poi-data.js"></script>
    
    <script>
        const map = L.map("map").setView([10.1094, 124.8996], 16);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

        function updateSidebar(poi) {
            document.getElementById("sidebar").classList.remove("sidebar-hidden");
            document.getElementById("poi-title").textContent = poi.title;
            document.getElementById("poi-meta").textContent = "Category: " + poi.category;
            document.getElementById("poi-description").textContent = poi.description;
            
            const container = document.getElementById("sidebar-image-container");
            const src = poi.imageUrl.startsWith("http") ? poi.imageUrl : "images/" + poi.imageUrl;
            container.innerHTML = `<img src="${src}" alt="${poi.title}">`;
        }

        function closeSidebar() {
            document.getElementById("sidebar").classList.add("sidebar-hidden");
        }

        // Initialize Markers
        if (typeof poiData !== 'undefined') {
            poiData.forEach(poi => {
                const jitter = 0.00005;
                const lat = poi.coords[0] + (Math.random() - 0.5) * jitter;
                const lng = poi.coords[1] + (Math.random() - 0.5) * jitter;

                const marker = L.marker([lat, lng]).addTo(map);
                marker.bindTooltip(poi.title, { permanent: false, direction: 'top', offset: [0, -10] });

                marker.on("click", (e) => {
                    L.DomEvent.stopPropagation(e);
                    updateSidebar(poi);
                    map.setView([lat, lng], 17);
                });
            });
        }

        // Click map to close sidebar
        map.on("click", () => {
            closeSidebar();
        });

        map.on("mousemove", (e) => {
            document.getElementById("status-bar").textContent = `Lat: ${e.latlng.lat.toFixed(4)}, Lng: ${e.latlng.lng.toFixed(4)}`;
        });

        function toggleFullscreen() {
            const el = document.getElementById("map-container");
            if (!document.fullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }
    </script>
</body>
</html>
