<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>poi-title</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        #sidebar {
            width: 320px;
            height: 100%;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        .sidebar-content {
            padding: 24px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .sidebar-content h2 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .sidebar-content .meta-text {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 16px;
        }

        .sidebar-content p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #34495e;
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .btn-fullscreen {
            width: 100%;
            padding: 12px;
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-fullscreen:hover {
            background-color: #1a252f;
        }

        #map-container {
            flex-grow: 1;
            position: relative;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #orbit-control {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
            background: #ffffff;
            padding: 10px 18px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #ddd;
            user-select: none;
        }

        #orbit-control:hover {
            background: #f9f9f9;
        }

        #status-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.92);
            border-top: 1px solid #ccc;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #333;
            z-index: 5;
        }

        .custom-popup {
            max-width: 240px;
        }

        .leaflet-container {
            width: 100%;
            height: 100%;
            background: #dfe3e8;
        }

        .popup-img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 4px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="sidebar-content">
            <h2 id="poi-title">Starting Point</h2>
            <div id="poi-meta" class="meta-text">Category: Village Entry</div>
            <p id="poi-description">
                Explore the Ichon coastal corridor. Click any marker to see local
                landmark details and profiles.
            </p>
        </div>
        <div class="sidebar-footer">
            <button class="btn-fullscreen" onclick="toggleFullscreen()">
                Open 3D Fullscreen View
            </button>
        </div>
    </div>

    <div id="map-container">
        <div id="orbit-control" onclick="toggleOrbit()">
            <span
                id="orbit-status-dot"
                style="width: 8px; height: 8px; background: #e74c3c; border-radius: 50%;"
            ></span>
            Auto Orbit
        </div>

        <div id="map"></div>

        <div id="status-bar">
            <div id="coordinates">Lat: --.----, Lng: --.----</div>
            <div>Leaflet | Ichon Village</div>
        </div>
    </div>

    <script src="poi-data.js"></script>
    <script>
        const startingCoordinates = [10.10943725, 124.8995989];
        const map = L.map("map").setView(startingCoordinates, 16);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);

        map.whenReady(() => {
            map.invalidateSize();
            setTimeout(() => map.invalidateSize(), 200);
        });
        window.addEventListener("resize", () => map.invalidateSize());

        let isOrbiting = false;
        let animationFrameId = null;

        // poiData is loaded from poi-data.js

        addMarkers();
        map.invalidateSize();

        map.on("mousemove", (e) => {
            document.getElementById("coordinates").textContent =
                `Lat: ${e.latlng.lat.toFixed(4)}, Lng: ${e.latlng.lng.toFixed(4)}`;
        });

        function addMarkers() {
            poiData.forEach((poi) => {
                const marker = L.marker(poi.coords).addTo(map);
                const imageHTML = poi.imageUrl
                    ? `<img src="${poi.imageUrl}" class="popup-img" alt="${poi.title}" />`
                    : "";
                const popup = L.popup({ offset: 25 }).setContent(`
                    <div class="custom-popup">
                        <strong>${poi.title}</strong><br/>
                        <span style="font-size:0.8rem; color:#666;">
                            ${poi.category}
                        </span>
                        ${imageHTML}
                        <p style="margin:8px 0 0; font-size:0.85rem; color:#444;">
                            ${poi.description}
                        </p>
                    </div>
                `);
                marker.bindPopup(popup);
                marker.on("click", () => updateSidebar(poi));
            });
        }

        function updateSidebar(poi) {
            document.getElementById("poi-title").innerText = poi.title;
            document.getElementById("poi-meta").innerText =
                "Category: " + poi.category;
            document.getElementById("poi-description").innerText =
                poi.description;
        }

        function orbitCamera() {
            if (!isOrbiting) return;
            animationFrameId = requestAnimationFrame(orbitCamera);
        }

        function toggleOrbit() {
            const dot = document.getElementById("orbit-status-dot");
            isOrbiting = !isOrbiting;
            dot.style.backgroundColor = isOrbiting ? "#2ecc71" : "#e74c3c";
        }

        function toggleFullscreen() {
            const container = document.getElementById("map-container");
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch((err) => {
                    alert(`Error enabling fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>
</body>
</html>
